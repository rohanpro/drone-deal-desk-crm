services:
  - type: web
    name: drone-deal-desk-crm
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    envVars:
      - key: AQ_TOKEN
        sync: false
      - key: WRITE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
