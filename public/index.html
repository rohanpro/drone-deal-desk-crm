<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --panel:#fffdf9; --ink:#1b1a17; --muted:#6b675f; --line:#e2ddd3; --soft:#efebe3;
  --red:#c2352b; --red-bg:#fbe9e6; --amber:#b86e00; --amber-bg:#fdf1dc; --green:#2f7a4a; --green-bg:#e5f3ea;
  --accent:#1f4fd1; --accent-bg:#e8eefc; --chip:#ece7dc; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px -12px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141412; --panel:#1c1b19; --ink:#ece8df; --muted:#9a958a; --line:#2f2d29; --soft:#24231f;
  --red:#ff6b5e; --red-bg:#3a1d1a; --amber:#f0a840; --amber-bg:#352915; --green:#5cc184; --green-bg:#17301f;
  --accent:#7aa2ff; --accent-bg:#1c2540; --chip:#2a2824; --shadow:none; }}
:root[data-theme="dark"]{
  --bg:#141412; --panel:#1c1b19; --ink:#ece8df; --muted:#9a958a; --line:#2f2d29; --soft:#24231f;
  --red:#ff6b5e; --red-bg:#3a1d1a; --amber:#f0a840; --amber-bg:#352915; --green:#5cc184; --green-bg:#17301f;
  --accent:#7aa2ff; --accent-bg:#1c2540; --chip:#2a2824; --shadow:none; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
a{color:var(--accent)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:8px}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pulse 2s infinite}
.dot.err{background:var(--red);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1320px;margin:0 auto;padding:18px 20px 80px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
section.q{margin-top:26px;scroll-margin-top:110px}
.qhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.qnum{font-family:"IBM Plex Mono",monospace;font-size:12px;border:1px solid var(--ink);border-radius:4px;padding:1px 6px}
.qhead h2{margin:0;font-size:20px;letter-spacing:-.01em}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.kpi{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.small{font-size:20px}
.sub{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:3px;font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--chip);color:var(--ink);border:0;border-radius:4px;padding:1px 6px;margin:2px 3px 2px 0;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.chip:hover{background:var(--accent-bg);color:var(--accent)}
.chip.fact-claim{box-shadow:inset 2px 0 0 var(--red)}
.chip.fact-told{box-shadow:inset 2px 0 0 var(--amber)}
.chip.fact-verified{box-shadow:inset 2px 0 0 var(--green)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.red{color:var(--red);background:var(--red-bg)} .amber{color:var(--amber);background:var(--amber-bg)} .green{color:var(--green);background:var(--green-bg)} .blue{color:var(--accent);background:var(--accent-bg)} .grey{color:var(--muted);background:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.move{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.move:last-child{border-bottom:0}
.rank{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500;color:var(--muted)}
.move.top .rank{color:var(--ink)}
.move h4{margin:0 0 4px;font-size:15px}
.move p{margin:0 0 6px;color:var(--muted);font-size:13px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;align-items:center}
.meta b{font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.risk{display:grid;grid-template-columns:70px 1fr 120px;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.risk:last-child{border-bottom:0}
.risk h4{margin:0 0 3px;font-size:14px}
.risk p{margin:0 0 4px;color:var(--muted);font-size:13px}
.when{font-size:12px;text-align:right}
.when b{display:block;font-size:13px;color:var(--ink)}
@media (max-width:700px){.risk{grid-template-columns:1fr}.when{text-align:left}.move{grid-template-columns:30px 1fr}.move .act{grid-column:2}}
.role{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.role:first-of-type{border-top:0}
.role .r{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stance{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:6px}
.stance.warm,.stance.ally{color:var(--green);background:var(--green-bg)} .stance.neutral{color:var(--muted);background:var(--soft)} .stance.guarded{color:var(--amber);background:var(--amber-bg)} .stance.never{color:var(--red);background:var(--red-bg)} .stance.gap{color:var(--red);background:var(--red-bg)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--accent);opacity:.85;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.bars div em{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-style:normal;color:var(--ink)}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--soft);margin:10px 0 6px}
.stack div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;margin-top:8px}
.dock{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:5px 4px;border-radius:4px;text-align:center;cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 40px -20px rgba(0,0,0,.35);transform:translateX(100%);transition:transform .2s;z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .body{padding:16px 18px;overflow:auto;flex:1}
.drawer pre{white-space:pre-wrap;font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--soft);padding:12px;border-radius:8px;max-height:60vh;overflow:auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin-bottom:12px}
.kv div:nth-child(odd){color:var(--muted)}
.feed{max-height:340px;overflow:auto}
.feed .it{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed .it time{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;transition:transform .25s;z-index:60;max-width:90vw;font-size:13px}
.toast.show{transform:translateX(-50%)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.nav a{font-size:12px;text-decoration:none;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:999px;background:var(--panel)}
.nav a:hover{color:var(--ink);border-color:var(--ink)}
.story{border-left:3px solid var(--amber);padding:6px 12px;background:var(--amber-bg);border-radius:0 8px 8px 0;font-size:13px;margin-top:10px}
.story b{color:var(--amber)}
.timeline{position:relative;padding-left:16px}
.timeline:before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding:4px 0 10px;font-size:13px}
.tl:before{content:"";position:absolute;left:-15px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tl.live:before{background:var(--red)}
.tl.future:before{background:var(--accent)}
.tl .d{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.dq li{font-size:12px;color:var(--muted);margin:2px 0}
.overview-card{cursor:pointer;transition:border-color .15s}
.overview-card:hover{border-color:var(--ink)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
footer{color:var(--muted);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
input.wk{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;width:120px}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">◆ Deal Desk <small>drone SaaS · renewals &amp; expansion</small></div>
    <div class="sync" id="sync"><span class="dot" id="dot"></span><span id="synctext">connecting…</span></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button class="tab" id="theme" title="Toggle theme">◐</button>
  </div>
</header>
<main id="app"><p class="empty">Loading…</p></main>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><div style="flex:1"><div class="sub" id="dkind"></div><h3 style="margin:2px 0 0;font-size:16px" id="dtitle"></h3></div><button class="btn" onclick="closeDrawer()">Close</button></header>
  <div class="body" id="dbody"></div>
</aside>
<div class="toast" id="toast"></div>
<script>
let S = null, view = localGet("view") || "overview";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
const fmtD = (d) => d ? new Date(d.length === 10 ? d + "T00:00:00Z" : d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) : "—";
const ago = (iso) => { if (!iso) return "never"; const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`; };
const money = (a, n) => n == null ? "—" : `${a.symbol}${Math.round(n).toLocaleString("en-GB")}`;
function chip(id) {
  const e = S.evidence[id]; if (!e) return "";
  const cls = e.kind === "fact" ? `fact-${e.status}` : "";
  const short = id.startsWith("calc:") ? "calc · " + id.split(":").pop() : id.replace(/^[AB]\//, "");
  return `<button class="chip ${cls}" title="${esc(e.label)}" onclick="openEv('${esc(id)}')">${esc(short)}</button>`;
}
const chips = (ids) => (ids || []).map(chip).join("");
const stanceCls = (s) => s === "never met" ? "never" : s;

async function load() {
  const r = await fetch("/api/state"); S = await r.json(); render();
}
function setView(v) { view = v; localSet("view", v); render(); window.scrollTo({ top: 0 }); }

function renderTabs() {
  const t = [["overview", "Both accounts"], ...S.accounts.map((a) => [a.id, `${a.id} · ${a.name.split(" ").slice(0, 2).join(" ")}`]), ["live", "Live feed"]];
  $("#tabs").innerHTML = t.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${view === k}" onclick="setView('${k}')">${esc(l)}</button>`).join("");
}
function renderSync() {
  const m = S.meta || {};
  $("#dot").className = "dot" + (m.lastError && (!m.lastOk || m.lastError.at > m.lastOk) ? " err" : "");
  const next = m.nextTick ? Math.max(0, Math.round((new Date(m.nextTick) - Date.now()) / 1000)) : null;
  $("#synctext").innerHTML = `as of <b>${fmtD(S.asOf)}</b> · last MCP call ${ago(m.lastOk)}${next != null ? ` · next in ${next}s` : ""}${S.pendingNotes.length ? ` · ${S.pendingNotes.length} note(s) queued` : ""}`;
}
setInterval(() => S && renderSync(), 5000);

function render() {
  renderTabs(); renderSync();
  if (view === "overview") return renderOverview();
  if (view === "live") return renderLive();
  const a = S.accounts.find((x) => x.id === view) || S.accounts[0];
  renderAccount(a);
}

function renderOverview() {
  const cards = S.accounts.map((a) => {
    const top = a.moves[0]; const reds = a.risks.filter((r) => r.level === "red");
    const hc = a.health.red >= 3 ? "red" : a.health.red ? "amber" : "green";
    return `<div class="card overview-card" onclick="setView('${a.id}')">
      <div class="flex"><span class="pill ${hc}">${esc(a.health.label)}</span><span class="sub">${esc(a.sector || "")}</span><span class="spacer"></span><span class="sub mono">${a.currency}</span></div>
      <h2 style="margin:8px 0 2px;font-size:20px">${esc(a.name)}</h2>
      <div class="sub">${esc(a.what_they_bought || "")}</div>
      <div class="grid g3" style="margin-top:14px">
        <div><div class="sub">Book you can back</div><div class="kpi small">${money(a, a.book.backed)}</div>${chip(a.book.backedCalc)}</div>
        <div><div class="sub">Not backed by usage</div><div class="kpi small" style="color:var(--red)">${money(a, a.book.at_risk)}</div>${chip(a.book.deals.find((d) => d.basis.length)?.basis[1])}</div>
        <div><div class="sub">Renewal</div><div class="kpi small">${a.days_to_renewal} days</div><div class="sub">${fmtD(a.term_ends)} · no auto-renew</div></div>
      </div>
      <div class="story"><b>Official story:</b> ${esc(a.official_story)}</div>
      ${top ? `<div style="margin-top:14px"><div class="sub">Monday, first thing</div><div style="font-weight:600;margin-top:2px">${esc(top.title)}</div><div class="meta" style="margin-top:4px"><span><b>${esc(top.owner.name)}</b></span><span>due <b>${fmtD(top.due)}</b></span></div></div>` : ""}
      <div style="margin-top:12px"><div class="sub">${reds.length} red risk(s)</div>${reds.slice(0, 3).map((r) => `<div style="font-size:13px;margin-top:3px">● ${esc(r.title)} <span class="sub">— turns bad ${fmtD(r.turns_bad)}</span></div>`).join("")}</div>
    </div>`;
  }).join("");
  const dates = S.accounts.flatMap((a) => a.keyDates.map((k) => ({ ...k, acc: a.id }))).filter((k) => k.date >= S.asOf).sort((x, y) => x.date.localeCompare(y.date)).slice(0, 12);
  $("#app").innerHTML = `
    <div class="qhead"><h2>Portfolio — what the manager needs on Monday</h2><p>Two accounts, five answers each. Every figure carries the id it came from — click any <span class="chip">chip</span> to trace it.</p></div>
    <div class="grid g2">${cards}</div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h3>Next 12 dates that matter</h3><table><tbody>${dates.map((k) => `<tr><td class="mono" style="white-space:nowrap">${fmtD(k.date)}</td><td><span class="pill ${k.level === "move" ? "blue" : k.level}">${k.level === "move" ? "do" : k.level}</span></td><td><b>${k.acc}</b> ${esc(k.what)}</td></tr>`).join("")}</tbody></table></div>
      <div class="card"><h3>Picked up by the sync</h3>${feedHTML(8)}</div>
    </div>
    ${footer()}`;
}

function feedHTML(n) {
  const ch = S.changes.slice(0, n);
  const sig = S.accounts.flatMap((a) => a.signals.map((id) => S.evidence[id]));
  return `<div class="feed">${ch.length ? ch.map((c) => `<div class="it"><time>${new Date(c.at).toLocaleString("en-GB")} · ${esc(c.kind)}</time>${esc(c.summary)} ${c.ref ? chip(c.ref) : ""}</div>`).join("") : ""}
    ${sig.map((e) => `<div class="it"><time>${fmtD(e.date)} · live event (get_signals)</time><b>${esc(e.label)}</b><br><span class="sub">${esc(e.text)}</span> ${chip(e.id)}</div>`).join("")}</div>`;
}

function renderLive() {
  const f = S.fetchedAt || {};
  $("#app").innerHTML = `
    <div class="qhead"><h2>Live feed &amp; sync</h2><p>One MCP call a minute (the token limit). Every source is re-read at least every 5 minutes; live events every ~2½ minutes. New data changes the answers without a code change.</p></div>
    <div class="grid g2">
      <div class="card"><h3>What changed</h3>${feedHTML(60)}</div>
      <div class="card"><h3>Sources &amp; freshness</h3><table><thead><tr><th>Source</th><th>Last fetched</th></tr></thead><tbody>${Object.entries(f).sort().map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${new Date(v).toLocaleString("en-GB")} <span class="sub">(${ago(v)})</span></td></tr>`).join("")}</tbody></table>
        ${S.meta.lastError ? `<p class="sub" style="color:var(--red)">Last error ${ago(S.meta.lastError.at)} on ${esc(S.meta.lastError.job)}: ${esc(S.meta.lastError.message)}</p>` : ""}
        <h3 style="margin-top:18px">Notes written back (list_notes)</h3>${notesHTML(null)}
        <h3 style="margin-top:18px">Queued for write_note</h3>${S.pendingNotes.length ? S.pendingNotes.map((n) => `<div class="sub">• [${esc(n.account || "-")}/${esc(n.kind || "note")}] ${esc(n.title || n.text.slice(0, 80))}</div>`).join("") : '<p class="empty">Nothing queued.</p>'}
      </div>
    </div>${footer()}`;
}
function notesHTML(acc) {
  const all = S.accounts.flatMap((a) => a.notes).filter((n, i, arr) => arr.findIndex((x) => JSON.stringify(x) === JSON.stringify(n)) === i).filter((n) => !acc || !n.account || n.account === acc);
  return all.length ? all.slice(-12).reverse().map((n) => `<div style="font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)"><span class="pill grey">${esc(n.kind || "note")}</span> <b>${esc(n.title || "")}</b> <span class="sub">${esc((n.text || "").slice(0, 160))}</span></div>`).join("") : '<p class="empty">None yet.</p>';
}

function renderAccount(a) {
  const renewal = a.book.deals.find((d) => d.basis.length);
  const won = a.book.offers.filter((o) => o.status === "won");
  const total = (renewal?.backed || 0) + (renewal?.at_risk || 0);
  $("#app").innerHTML = `
  <div class="flex"><div><div class="sub">Account ${a.id} · ${esc(a.sector || "")} · ${a.currency}</div><h1 style="margin:2px 0;font-size:26px;letter-spacing:-.02em">${esc(a.name)}</h1></div><span class="spacer"></span>
    <span class="pill ${a.health.red >= 3 ? "red" : a.health.red ? "amber" : "green"}">${esc(a.health.label)} · ${a.health.red} red / ${a.health.amber} amber</span></div>
  <div class="nav">${[["q1", "1 Book"], ["q2", "2 Power"], ["q3", "3 First moves"], ["q4", "4 Going wrong"], ["q5", "5 Unknowns"], ["growth", "Upsell & cross-sell"], ["usage", "Usage"], ["timeline", "Timeline"]].map(([h, l]) => `<a href="#${h}">${l}</a>`).join("")}</div>
  <div class="story"><b>Official story (unverified):</b> ${esc(a.official_story)}</div>

  <section class="q" id="q1"><div class="qhead"><span class="qnum">Q1</span><h2>What is the book worth?</h2><p>Each deal at a value you can back. What you cannot back is shown apart.</p></div>
    <div class="grid g4">
      <div class="card"><h3>Book you can back</h3><div class="kpi">${money(a, a.book.backed)}</div>${chip(a.book.backedCalc)}<div class="sub">Renewal backed by usage + upsells won</div></div>
      <div class="card"><h3>Renewal not backed</h3><div class="kpi" style="color:var(--red)">${money(a, a.book.at_risk)}</div>${renewal ? chip(renewal.basis[1]) : ""}<div class="sub">Docks nobody uses</div></div>
      <div class="card"><h3>Contract / year</h3><div class="kpi">${money(a, a.annual)}</div>${chip(a.id + "/contract.txt")}${chip("calc:" + a.id + ":per_dock")}<div class="sub">${money(a, a.perDock)} per dock</div></div>
      <div class="card"><h3>Open offers</h3><div class="kpi">${money(a, a.book.open_offers)}</div>${chips(a.book.offers.filter((o) => o.status === "open").map((o) => o.id))}<div class="sub">Pipeline — not counted</div></div>
    </div>
    ${renewal ? `<div class="card" style="margin-top:14px"><h3>Renewal split</h3>
      <div class="stack"><div style="width:${(100 * renewal.backed) / total}%;background:var(--green)"></div><div style="width:${(100 * renewal.at_risk) / total}%;background:var(--red)"></div></div>
      <div class="legend"><span><i style="background:var(--green)"></i>Backed ${money(a, renewal.backed)}</span><span><i style="background:var(--red)"></i>At risk ${money(a, renewal.at_risk)}</span></div>
      ${renewal.basis.map((b) => `<div class="sub" style="margin-top:6px">${esc(S.evidence[b].text)} ${chips(S.evidence[b].cites)}</div>`).join("")}</div>` : ""}
    <div class="card tablewrap" style="margin-top:14px"><h3>Deals &amp; offers</h3><table><thead><tr><th>Deal</th><th>Stage</th><th class="num">Backed</th><th class="num">At risk</th><th>Blocker / basis</th><th>Sources</th></tr></thead><tbody>
      ${a.book.deals.map((d) => `<tr><td><b>${esc(d.title)}</b><div class="sub mono">${esc(d.id)}</div></td><td><span class="pill ${d.unknown ? "grey" : d.stage === "qualified" ? "blue" : "grey"}">${esc(d.stage)}</span></td><td class="num">${d.backed ? money(a, d.backed) : "—"}</td><td class="num">${d.at_risk ? money(a, d.at_risk) : "—"}</td>
        <td style="max-width:360px">${d.blocker ? `<div><b>On file:</b> ${esc(d.blocker.text)} (${esc(d.blocker.status)})</div>` : ""}${d.debrief?.blocker ? `<div><b>Debrief:</b> ${esc(d.debrief.blocker)}</div>` : ""}${d.debrief?.unlock ? `<div><b>Unlock:</b> ${esc(d.debrief.unlock)}</div>` : ""}${!d.backed && !d.unknown ? '<div class="sub">No value on file — not counted.</div>' : ""}${d.unknown ? '<div class="sub">Never came up in discovery.</div>' : ""}${d.debrief?.debrief_value_usd ? `<div class="sub">Debrief scored it $${d.debrief.debrief_value_usd.toLocaleString()}</div>` : ""}</td>
        <td>${chips(d.cites)}</td></tr>`).join("")}
      ${a.book.offers.map((o) => `<tr><td><b>${esc(o.title)}</b><div class="sub mono">${esc(o.id)} · offer to ${esc(o.pitch_to)}</div></td><td><span class="pill ${o.status === "won" ? "green" : o.status === "open" ? "blue" : "grey"}">${esc(o.status)}</span></td><td class="num">${o.status === "won" ? money(a, o.value) : "—"}</td><td class="num">—</td><td class="sub">${o.status === "won" ? "Won this morning — counts once delivered" : o.status === "open" ? `${money(a, o.value)} pipeline, not counted` : `${money(a, o.value)} declined — excluded`}</td><td>${chips(o.cites)}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="card" style="margin-top:14px"><h3>Shown apart — claims and asks nobody has backed</h3>${a.book.claimsApart.length ? `<table><tbody>${a.book.claimsApart.map((c) => `<tr><td>“${esc(c.text)}”<div class="sub">${esc(c.by)} · ${c.told ? "told" : "claim"}</div></td><td class="num">${c.implied ? money(a, c.implied) : "—"}<div class="sub">${esc(c.impliedNote || "")}</div></td><td>${chip(c.id)}</td></tr>`).join("")}</tbody></table>` : '<p class="empty">None.</p>'}</div>
  </section>

  <section class="q" id="q2"><div class="qhead"><span class="qnum">Q2</span><h2>Who holds the power?</h2><p>Who decides, pays, uses, could block — and where each stands with you.</p></div>
    <div class="grid g2">${a.power.map((p) => `<div class="card"><h3>${esc(p.title)}</h3>${p.roles.length ? p.roles.map((r) => `<div class="role"><div class="r">${esc(r.role)}</div><div><b>${esc(r.who)}</b>${r.role_title ? ` <span class="sub">${esc(r.role_title)}</span>` : ""}<span class="stance ${stanceCls(r.stance)}">${esc(r.stance)}</span><div class="sub">${esc(r.why)}</div>${chips(r.cites)}</div></div>`).join("") : '<p class="empty">Nobody known.</p>'}</div>`).join("")}</div>
    <div class="card tablewrap" style="margin-top:14px"><h3>People</h3><table><thead><tr><th>Person</th><th>Stance</th><th>Last contact</th><th>Platform use</th><th>Sources</th></tr></thead><tbody>
      ${a.people.map((p) => `<tr><td><b>${esc(p.name)}</b><div class="sub">${esc(p.role)}</div></td><td><span class="stance ${stanceCls(p.relationship)}">${esc(p.relationship)}</span></td><td>${p.last_contact ? fmtD(p.last_contact) : "—"}</td><td>${p.platform ? `${p.platform.sign_ins_90d} sign-ins / 90d` : "—"}</td><td>${chips(p.cites)}</td></tr>`).join("")}
    </tbody></table></div>
  </section>

  <section class="q" id="q3"><div class="qhead"><span class="qnum">Q3</span><h2>What do you do first?</h2><p>Ranked by value at stake × urgency × days left. Each with an owner, a date and the deal it moves.</p></div>
    <div class="card">${a.moves.map((m, i) => `<div class="move ${i < 3 ? "top" : ""}"><div class="rank">${m.rank}</div><div><h4>${esc(m.title)}</h4><p>${esc(m.why)}</p>
      <div class="meta"><span>Owner <b>${esc(m.owner.name)}</b>${m.with?.length ? ` with ${m.with.map((w) => esc(w.name)).join(", ")}` : ""}</span><span>Due <b>${fmtD(m.due)}</b> <span class="sub">(${m.days_left}d)</span></span>${m.deal ? `<span>Moves <span class="mono">${esc(m.deal)}</span></span>` : ""}<span class="sub">score ${m.score}</span></div>
      <div style="margin-top:4px">${chips([m.owner.cite, ...m.cites])}</div></div>
      <div class="act"><button class="btn" onclick='writeBack(${JSON.stringify({ account: a.id, kind: "next_step", title: m.title.slice(0, 150), text: `${m.why}\nOwner: ${m.owner.name}. Due: ${m.due}. Deal: ${m.deal}. Sources: ${m.cites.join(", ")}` }).replace(/'/g, "&#39;")})'>Write to MCP</button></div></div>`).join("")}</div>
  </section>

  <section class="q" id="q4"><div class="qhead"><span class="qnum">Q4</span><h2>What is about to go wrong?</h2><p>Deadlines at risk, people going cold, stuck deals — and the date each turns bad.</p></div>
    <div class="card">${a.risks.map((r) => `<div class="risk"><div><span class="pill ${r.level}">${r.level}</span><div class="sub" style="margin-top:4px">${esc(r.type)}</div></div><div><h4>${esc(r.title)}</h4><p>${esc(r.detail)}</p>${chips(r.cites)}</div><div class="when">${r.turns_bad ? `turns bad<b>${fmtD(r.turns_bad)}</b><span class="sub">${esc(r.turns_bad_why || "")}</span>` : '<span class="sub">no date — standing risk</span>'}</div></div>`).join("")}</div>
  </section>

  <section class="q" id="q5"><div class="qhead"><span class="qnum">Q5</span><h2>What do you still not know?</h2><p>The gaps the plan rests on, why each matters, and who could fill it.</p></div>
    <div class="card tablewrap"><table><thead><tr><th>Unknown</th><th>Why it matters</th><th>Who could tell you</th><th>Sources</th></tr></thead><tbody>
      ${a.gaps.map((g) => `<tr><td><b>${esc(g.what)}</b></td><td class="sub">${esc(g.why)}</td><td>${esc(g.who)}</td><td>${chips(g.cites)}</td></tr>`).join("")}
    </tbody></table></div>
  </section>

  <section class="q" id="growth"><div class="qhead"><span class="qnum">+</span><h2>Upsell &amp; cross-sell</h2><p>Where revenue can grow — sized only where the data allows.</p></div>
    <div class="card tablewrap"><table><thead><tr><th>Opportunity</th><th>Type</th><th>Size</th><th>Next</th><th>Sources</th></tr></thead><tbody>
      ${a.growth.map((g) => `<tr><td><b>${esc(g.title)}</b><div class="sub">${esc(g.stage)}</div></td><td>${esc(g.kind)}</td><td>${esc(g.sizing)}</td><td class="sub">${esc(g.next)}</td><td>${chips(g.cites)}</td></tr>`).join("")}
    </tbody></table></div>
  </section>

  <section class="q" id="usage"><div class="qhead"><span class="qnum">≈</span><h2>Usage — the evidence under the renewal</h2><p>Built from raw flights.csv, device_events.csv${a.forceLog ? " and the verified force log" : ""}.</p></div>
    <div class="grid g2">
      <div class="card"><h3>Flights per month ${chip(a.id + "/flights.csv")}</h3>${barsHTML(a.usage.months.map((m) => [m.month.slice(5), m.flights]))}<div style="height:18px"></div>
        <h3 style="margin-top:12px">Docks flying per month (of ${a.usage.totalDocks})</h3>${barsHTML(a.usage.months.map((m) => [m.month.slice(5), m.docks_flying]), a.usage.totalDocks)}<div style="height:18px"></div></div>
      <div class="card"><h3>Every dock, last 3 months ${chip("calc:" + a.id + ":tiers")}</h3>
        <div class="legend"><span><i style="background:var(--green)"></i>regular (4+/mo)</span><span><i style="background:var(--amber)"></i>light</span><span><i style="background:var(--red)"></i>idle</span><span>⚠ battery / ⇣ offline</span></div>
        <div class="dockgrid">${a.usage.docks.map((d) => { const t = a.usage.tiers.regular.includes(d.dock) ? "green" : a.usage.tiers.light.includes(d.dock) ? "amber" : "red"; return `<div class="dock ${t}" title="${esc(d.dock)}: ${d.flights_total} flights May–Oct, ${d.flights_last3} in last 3 months, ${d.battery_warnings} battery warnings, ${d.connection_drops} connection drops">${esc(d.dock.split("-").pop())}<br>${d.flights_last3}${d.battery_warnings >= 10 ? " ⚠" : ""}${d.offline_spells ? " ⇣" : ""}</div>`; }).join("")}</div>
        <p class="sub">${a.usage.flights} flights, ${a.usage.neverFlew.length} docks never flew ${chip("calc:" + a.id + ":never_flew")}</p></div>
    </div>
    ${a.forceLog ? `<div class="grid g2" style="margin-top:14px"><div class="card tablewrap"><h3>By force — ${chip(a.forceLog.file)} (cleaned)</h3><table><thead><tr><th>Force</th><th class="num">Docks</th><th class="num">Live missions</th><th class="num">Training</th><th>Latest month</th><th class="num">Renewal value</th></tr></thead><tbody>
        ${a.forceLog.summary.map((f) => `<tr><td><b>${esc(f.force)}</b></td><td class="num">${f.docks}</td><td class="num">${f.live_missions}</td><td class="num">${f.training}</td><td>${f.last_docks_live}/${f.docks} docks live in ${f.last_month}</td><td class="num"><span class="pill ${f.operational ? "green" : "red"}">${money(a, f.docks * a.perDock)}</span></td></tr>`).join("")}</tbody></table></div>
      <div class="card"><h3>How the raw file was cleaned</h3><ul class="dq">${a.forceLog.issues.map((i) => `<li>${i.line ? `line ${i.line}: ` : ""}${esc(i.issue)}</li>`).join("")}</ul></div></div>` : ""}
  </section>

  <section class="q" id="timeline"><div class="qhead"><span class="qnum">↧</span><h2>Timeline</h2><p>History on file, live events and the dates ahead.</p></div>
    <div class="grid g2"><div class="card"><h3>Deal history</h3><div class="timeline">${a.timeline.map((t) => `<div class="tl ${t.live ? "live" : ""}"><div class="d">${esc(t.date)}</div><b>${esc(t.what)}</b> ${t.detail ? `<span class="sub">${esc(t.detail)}</span>` : ""} ${chip(t.cite)}</div>`).join("")}</div></div>
    <div class="card"><h3>Ahead</h3><div class="timeline">${a.keyDates.filter((k) => k.date >= S.asOf).map((k) => `<div class="tl future"><div class="d">${fmtD(k.date)}</div><span class="pill ${k.level === "move" ? "blue" : k.level}">${k.level === "move" ? "do" : k.level}</span> ${esc(k.what)}</div>`).join("")}</div>
      <h3 style="margin-top:16px">Notes on this account (from list_notes)</h3>${notesHTML(a.id)}
      <div class="flex" style="margin-top:10px"><button class="btn primary" onclick="writePlan('${a.id}')">Write the Monday plan to MCP</button></div></div></div>
  </section>
  ${footer()}`;
}

function barsHTML(pairs, max) {
  const m = max || Math.max(1, ...pairs.map((p) => p[1]));
  return `<div class="bars">${pairs.map(([l, v]) => `<div style="height:${(100 * v) / m}%"><em>${v}</em><span>${esc(l)}</span></div>`).join("")}</div>`;
}
function footer() {
  return `<footer>Sources: Account Quest MCP (get_my_accounts, get_all_paperwork, get_signals, get_file, list_notes, get_flytbase_team, get_feature_requests) and the morning debrief from the play page. Chips coloured by fact status: <span class="chip fact-verified">verified</span><span class="chip fact-told">told</span><span class="chip fact-claim">claim</span>. Money is per account currency; accounts are never summed. Debrief values are the game's score in USD and are shown, not counted.</footer>`;
}

async function openEv(id) {
  let e = S.evidence[id];
  if (e?.truncated) e = await (await fetch("/api/evidence?id=" + encodeURIComponent(id))).json();
  $("#dkind").textContent = `${e.kind}${e.status ? " · " + e.status : ""} · ${id}`;
  $("#dtitle").textContent = e.label;
  const rows = [["Where", e.where], ["Said by", e.said_by], ["Verified by", e.verified_by], ["Relationship", e.relationship], ["Stage", e.stage], ["Date", e.date], ["Value", e.value != null && typeof e.value !== "object" ? Number(e.value).toLocaleString("en-GB") : null], ["Learned", e.minute != null ? `minute ${e.minute} of discovery` : null]].filter((r) => r[1]);
  $("#dbody").innerHTML = `<div class="kv">${rows.map(([k, v]) => `<div>${k}</div><div>${esc(v)}</div>`).join("")}</div>
    ${e.cites?.length ? `<div class="sub">Built from</div><div style="margin:4px 0 12px">${chips(e.cites)}</div>` : ""}
    ${e.text ? `<pre>${esc(e.text)}</pre>` : ""}
    ${e.records ? e.records.map((r) => `<div class="sub" style="margin-top:10px">${esc(r.kind)} · ${esc(r.path)}</div><pre>${esc(r.text)}</pre>`).join("") : ""}`;
  $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden", "false");
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true"); }
document.addEventListener("keydown", (e) => e.key === "Escape" && closeDrawer());

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 4000); }
async function writeBack(note) {
  let key = localGet("wk") || "";
  let r = await fetch("/api/notes", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...note, key }) });
  if (r.status === 403) { key = prompt("Write key (set on the server as WRITE_KEY):") || ""; localSet("wk", key); r = await fetch("/api/notes", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...note, key }) }); }
  const j = await r.json();
  toast(r.ok ? `Queued for write_note (position ${j.position}; one call a minute)` : `Not saved: ${j.error}`);
  load();
}
async function writePlan(acc) {
  const a = S.accounts.find((x) => x.id === acc);
  const text = a.moves.slice(0, 3).map((m) => `${m.rank}. ${m.title} — ${m.owner.name}, by ${m.due} (${m.deal}). Sources: ${m.cites.join(", ")}`).join("\n");
  writeBack({ account: acc, kind: "task", title: `Monday plan — ${a.name}`, text });
}

$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const n = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; localSet("theme", n); };
if (localGet("theme")) document.documentElement.dataset.theme = localGet("theme");

// live: server pushes on every change; poll as a fallback
try { const es = new EventSource("/api/events"); es.addEventListener("update", (m) => { const d = JSON.parse(m.data); const c = d.changes?.[0]; if (c && Date.now() - new Date(c.at) < 70000) toast("New: " + c.summary); load(); }); } catch {}
setInterval(load, 60000);
load();
</script>
</body>
</html>
