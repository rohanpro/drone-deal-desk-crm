<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flightdeck CRM</title>
<link rel="icon" href="/brand.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --panel:#FFFFFF; --ink:#0F1B2D; --muted:#5B6B82; --line:#E3E8F0; --soft:#EEF2F8;
  --navy:#0B1B33; --navy2:#13284A; --sky:#2F80ED; --sky-bg:#E7F0FD; --orange:#FF6B2C; --orange-bg:#FFEDE4;
  --green:#1F9D63; --green-bg:#E3F5EC; --amber:#C98303; --amber-bg:#FDF2DC; --red:#D93B30; --red-bg:#FCE7E5;
  --violet:#6E56F0; --violet-bg:#EEEBFE; --grey:#6B7A90; --grey-bg:#EEF1F5;
  --shadow:0 1px 2px rgba(15,27,45,.04),0 8px 24px -14px rgba(15,27,45,.18); --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1424; --panel:#101D33; --ink:#E8EEF7; --muted:#93A3BB; --line:#1E2F4B; --soft:#15253F;
  --sky-bg:#132C52; --orange-bg:#3A2114; --green-bg:#0F2E22; --amber-bg:#33270C; --red-bg:#3A1714; --violet-bg:#221B4A; --grey-bg:#1A2840; --shadow:none; }}
:root[data-theme="dark"]{ --bg:#0A1424; --panel:#101D33; --ink:#E8EEF7; --muted:#93A3BB; --line:#1E2F4B; --soft:#15253F;
  --sky-bg:#132C52; --orange-bg:#3A2114; --green-bg:#0F2E22; --amber-bg:#33270C; --red-bg:#3A1714; --violet-bg:#221B4A; --grey-bg:#1A2840; --shadow:none; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--sky)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside.side{background:var(--navy);color:#C9D6EA;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:#fff}
.logo img{width:34px;height:34px}
.logo b{font-size:17px;letter-spacing:-.01em}
.logo small{display:block;font-size:11px;color:#8FA6C8;font-weight:500}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;border:0;background:none;color:#C9D6EA;text-align:left;width:100%;font-size:14px}
.nav-i:hover{background:var(--navy2);color:#fff}
.nav-i.on{background:var(--sky);color:#fff}
.nav-i .ic{width:20px;text-align:center}
.nav-i .badge{margin-left:auto;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:600}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6F86AA;padding:14px 10px 4px}
.side .foot{margin-top:auto;font-size:12px;color:#8FA6C8;padding:8px}
.live{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
.dot.err{background:var(--red);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
main{padding:22px 28px 80px;min-width:0;max-width:1280px;width:100%}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:24px;letter-spacing:-.02em}
.topbar .sub{color:var(--muted)}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
@media (max-width:1100px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside.side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;align-items:center}
  .logo{padding:0 8px 0 2px}.logo small,.nav-h,.side .foot{display:none}
  #nav{display:flex;gap:4px}
  .nav-i{width:auto;white-space:nowrap;padding:7px 10px}
  main{padding:16px}
  .g2,.g3,.g5{grid-template-columns:1fr}
}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-red{color:var(--red);background:var(--red-bg)} .c-amber{color:var(--amber);background:var(--amber-bg)} .c-green{color:var(--green);background:var(--green-bg)}
.c-blue{color:var(--sky);background:var(--sky-bg)} .c-orange{color:var(--orange);background:var(--orange-bg)} .c-violet{color:var(--violet);background:var(--violet-bg)} .c-grey{color:var(--grey);background:var(--grey-bg)}
.src{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:var(--soft);border:0;border-radius:6px;padding:2px 8px;cursor:pointer;margin:2px 4px 2px 0}
.src:hover{color:var(--sky);background:var(--sky-bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--sky);color:var(--sky)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pri:hover{filter:brightness(1.05);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.on{background:var(--sky);border-color:var(--sky);color:#fff}
.muted{color:var(--muted)}
.small{font-size:12px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mid{font-size:20px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--orange)}
.tab .n{font-size:11px;background:var(--soft);border-radius:999px;padding:0 6px;margin-left:4px}
/* answers */
.ans{border-top:4px solid var(--c);cursor:pointer;transition:transform .12s}
.ans:hover{transform:translateY(-2px)}
.ans .q{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c)}
.ans .a{font-size:16px;font-weight:600;margin:6px 0;line-height:1.35}
.ans .m{font-size:13px;color:var(--muted);white-space:pre-line}
/* health */
.ring{--p:50;--col:var(--sky);width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--col) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring b{width:60px;height:60px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:20px}
.ring.sm{width:52px;height:52px}.ring.sm b{width:40px;height:40px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.life{display:flex;gap:4px;margin-top:6px}
.life span{flex:1;text-align:center;font-size:11px;padding:4px 0;border-radius:6px;background:var(--soft);color:var(--muted);font-weight:600}
.life span.on{background:var(--orange);color:#fff}
/* actions */
.act{border:1px solid var(--line);border-left:4px solid var(--c,var(--sky));border-radius:12px;padding:14px 16px;background:var(--panel);margin-bottom:12px}
.act.done{opacity:.6}
.act.done .t{text-decoration:line-through}
.act .t{font-weight:650;font-size:15px;margin:0}
.act .why{color:var(--muted);font-size:13px;margin:6px 0}
.rank{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:700;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--sky);color:#fff}
.seg button.on.done{background:var(--green)}
.how{background:var(--soft);border-radius:10px;padding:12px 14px;margin-top:10px}
.how ol{margin:6px 0;padding-left:20px}
.how li{margin:3px 0}
.draft{white-space:pre-wrap;font-size:13px;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:6px}
details>summary{cursor:pointer;list-style:none;font-weight:600;color:var(--sky);font-size:13px}
details>summary::-webkit-details-marker{display:none}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:12px;padding:10px;min-height:120px}
.col h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.col h4 small{color:var(--muted);font-weight:500}
.dc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;border-top:3px solid var(--c)}
.dc:hover{border-color:var(--sky)}
.dc .tt{font-weight:600;font-size:13px;line-height:1.3}
.medd{display:flex;gap:3px;margin-top:6px}
.medd span{width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700;display:grid;place-items:center;color:#fff}
.medd .green{background:var(--green)}.medd .amber{background:var(--amber)}.medd .red{background:var(--red)}
/* lists */
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .tt{font-weight:600}
.tl-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.tw{overflow-x:auto}
.person{display:flex;gap:12px;align-items:flex-start}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .pill{white-space:normal;line-height:1.3}
.filter{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.filter.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* chat */
.chat{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 120px);min-height:480px}
@media (max-width:820px){.chat{grid-template-columns:1fr;height:auto}}
.chans{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:2px}
.chan{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.chan.on{background:var(--sky-bg);color:var(--sky)}
.msgs{display:flex;flex-direction:column;min-height:0}
.stream{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.msg{display:flex;gap:10px;max-width:780px}
.msg .bub{background:var(--soft);border-radius:4px 14px 14px 14px;padding:9px 13px;white-space:pre-wrap;word-wrap:break-word;min-width:0}
.msg.ai .bub{background:var(--sky-bg)}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.mine .bub{background:var(--navy);color:#fff;border-radius:14px 4px 14px 14px}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.compose{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
.compose textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--panel);color:var(--ink);min-height:44px;max-height:140px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
/* drawer & modal */
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100vw);background:var(--panel);box-shadow:-24px 0 48px -24px rgba(0,0,0,.4);transform:translateX(105%);transition:transform .2s;z-index:60;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer pre{white-space:pre-wrap;font:12px/1.5 "JetBrains Mono",monospace;background:var(--soft);padding:12px;border-radius:10px;max-height:55vh;overflow:auto}
.scrim{position:fixed;inset:0;background:rgba(10,20,36,.45);z-index:55;display:none}
.scrim.open{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border-radius:16px;padding:24px;z-index:70;width:min(420px,92vw);display:none;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal.open{display:block}
.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--panel);color:var(--ink);margin:4px 0 12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:80;transition:transform .25s;max-width:90vw;font-size:13px}
.toast.show{transform:translateX(-50%)}
.hero{background:linear-gradient(135deg,var(--navy),#1B3A6B);color:#fff;border-radius:var(--r);padding:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero .sub{color:#B9C9E2}
.empty{color:var(--muted);font-style:italic;padding:12px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;margin-bottom:12px}
.kv div:nth-child(odd){color:var(--muted)}
.lb{display:flex;align-items:center;gap:10px;padding:6px 0}
.lb .bar{flex:1}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
.howto p{max-width:760px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><img src="/brand.svg" alt=""><div><b>Flightdeck</b><small>Revenue cockpit · drone-in-a-box</small></div></div>
    <div id="nav"></div>
    <div class="foot"><div class="live"><span class="dot" id="dot"></span><span id="livetext">Connecting…</span></div><button class="nav-i" id="theme" style="margin-top:8px;padding:6px 0">◐ Light / dark</button></div>
  </aside>
  <main id="main"><p class="empty">Loading Flightdeck…</p></main>
</div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"><header><div style="flex:1"><div class="small muted" id="dk"></div><h3 style="margin:2px 0 0" id="dt"></h3></div><button class="btn sm" onclick="closeDrawer()">Close</button></header><div class="body" id="db"></div></aside>
<div class="modal" id="who">
  <h3 style="margin:0 0 4px">Welcome to Flightdeck</h3><p class="muted small" style="margin:0 0 14px">Tell us who you are, so we can show your work first.</p>
  <label class="small">Your name</label><input id="whoName" placeholder="e.g. Priya">
  <label class="small">Your role</label><select id="whoRole"></select>
  <button class="btn pri" style="width:100%" onclick="saveWho()">Start</button>
</div>
<div class="toast" id="toast"></div>
<script>
// ---------- state ----------
let S = null, C = { messages: [], tasks: {}, points: {} };
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let me = JSON.parse(ls.get("fd_me") || "null");
let route = ls.get("fd_route") || "today";
let acctTab = ls.get("fd_tab") || "overview";
let chatChan = "general", histFilter = "all", planScope = "mine", pipeAcct = "all";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const D = (d) => d ? new Date(d.length === 10 ? d + "T00:00:00Z" : d).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) : "—";
const DY = (d) => d ? new Date(d.length === 10 ? d + "T00:00:00Z" : d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) : "—";
const ago = (iso) => { if (!iso) return "never"; const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
const daysTo = (d) => Math.round((new Date(d + "T00:00:00Z") - new Date(S.asOf + "T00:00:00Z")) / 864e5);
const COLORS = ["#2F80ED", "#FF6B2C", "#1F9D63", "#6E56F0", "#D93B30", "#C98303", "#0EA5B7"];
const avColor = (n) => COLORS[[...String(n)].reduce((s, c) => s + c.charCodeAt(0), 0) % COLORS.length];
const initials = (n) => String(n).replace(/\(.*\)/, "").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const av = (n, size = 28) => `<span class="av" style="background:${avColor(n)};width:${size}px;height:${size}px;font-size:${size / 2.4}px">${esc(initials(n))}</span>`;
const lvl = { red: "c-red", amber: "c-amber", green: "c-green" };
const acc = (id) => S.accounts.find((a) => a.id === id);
const K = (a, n) => n == null ? "—" : n >= 1e6 ? `${a.symbol}${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${a.symbol}${Math.round(n / 1e3)}k` : `${a.symbol}${Math.round(n)}`;
const shortName = (a) => a.id === "A" ? "Eastern Counties" : "Aldermoor";

// Sources: shown as a small 📎 chip with a human label; full record in the drawer.
function src(ids, label) {
  ids = [...new Set((ids || []).filter((i) => S.evidence[i]))];
  if (!ids.length) return "";
  const first = S.evidence[ids[0]];
  const text = label || (ids.length === 1 ? first.human : `${first.human} +${ids.length - 1}`);
  return `<button class="src" title="See where this comes from" onclick='openSources(${JSON.stringify(ids).replace(/'/g, "&#39;")})'>📎 ${esc(text)}</button>`;
}
function linkCites(text) { // [id] in coach answers -> source chips
  return esc(text).replace(/\[([^\]\s]{2,80})\]/g, (m, id) => { const raw = id.replace(/&amp;/g, "&"); return S.evidence[raw] ? src([raw]) : m; }).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

// ---------- data ----------
async function load() {
  const [s, c] = await Promise.all([fetch("/api/state").then((r) => r.json()), fetch("/api/collab").then((r) => r.json())]);
  S = s; C = c; render();
}
async function loadCollab() { C = await fetch("/api/collab").then((r) => r.json()); if (route === "chat") renderChatStream(); else render(); }
function go(r, tab) { route = r; ls.set("fd_route", r); if (tab) { acctTab = tab; ls.set("fd_tab", tab); } render(); window.scrollTo({ top: 0 }); }
function setTab(t) { acctTab = t; ls.set("fd_tab", t); render(); }

// ---------- shell ----------
function renderNav() {
  const openT = S.accounts.reduce((s, a) => s + a.tickets.filter((t) => t.open).length, 0);
  const myOpen = allMoves().filter((m) => isMine(m) && status(m) !== "done").length;
  const items = [["today", "🏠", "Today", myOpen], ["pipeline", "🧭", "Pipeline"], ["_h", "Accounts"], ...S.accounts.map((a) => [`acct:${a.id}`, a.healthScore.color === "red" ? "🔴" : a.healthScore.color === "amber" ? "🟠" : "🟢", shortName(a)]), ["_h", "Team"], ["tickets", "🎫", "Tickets", openT], ["chat", "💬", "Team chat"], ["updates", "📡", "Live updates"], ["how", "📘", "How it works"]];
  $("#nav").innerHTML = items.map(([k, ic, l, n]) => k === "_h" ? `<div class="nav-h">${ic}</div>` : `<button class="nav-i ${route === k ? "on" : ""}" onclick="go('${k}')"><span class="ic">${ic}</span>${esc(l)}${n ? `<span class="badge">${n}</span>` : ""}</button>`).join("");

async function setStatus(id, st) {

function dueChip(d) {

        </details>`}

  const roleOf = (name) => [...new Set(a.power.flatMap((p) => p.roles.filter((r) => r.who === name).map((r) => `${r.role.replace(/ \(.*\)/, "")} · ${a.pipeline.find((d) => d.id === p.deal)?.title.split(" (")[0] || p.deal}`)))];
  const st = { ally: "c-green", warm: "c-green", neutral: "c-grey", guarded: "c-amber", "never met": "c-red" };
  const card = (p) => `<div class="card"><div class="person">${av(p.name, 40)}<div style="flex:1;min-width:0"><div class="row"><b>${esc(p.name)}</b><span class="pill ${st[p.relationship] || "c-grey"}">${esc(p.relationship)}</span></div><div class="small muted">${esc(p.role)}</div>
    <div class="small" style="margin-top:6px">${p.last_contact ? `Last contact ${D(p.last_contact)} · ` : ""}${p.platform ? `${p.platform.sign_ins_90d} logins in 90 days` : ""}</div>
    <div class="chips" style="margin-top:6px">${roleOf(p.name).map((r) => `<span class="pill c-violet">${esc(r)}</span>`).join("")}</div><div style="margin-top:6px">${src(p.cites)}</div></div></div></div>`;
  const gaps = a.power.flatMap((p) => p.roles.filter((r) => r.stance === "gap").map((r) => ({ ...r, deal: p.title })));
  return `<p class="muted" style="margin-top:0">The buying committee: who decides, pays, uses and could block each deal — and how warm they are to us.</p>
  <h3>People we know</h3><div class="grid g3">${a.people.filter((p) => p.met).map(card).join("")}</div>
  <h3 style="margin-top:20px">Not met yet — but they matter</h3><div class="grid g3">${a.people.filter((p) => !p.met).map(card).join("") || '<p class="empty">Nobody.</p>'}</div>
  ${gaps.length ? `<div class="card" style="margin-top:16px"><h3>❓ Seats we can't name</h3>${gaps.map((g) => `<div class="li"><span class="pill c-red">${esc(g.role)}</span><div class="body small">${esc(g.why)} <span class="muted">· ${esc(g.deal)}</span></div>${src(g.cites)}</div>`).join("")}</div>` : ""}`;
}
function tRisks(a) {
  return `<div class="card">${a.risks.map((r) => `<div class="li"><span class="pill ${lvl[r.level]}" style="min-width:64px;justify-content:center">${r.level === "red" ? "Act now" : "Watch"}</span><div class="body"><div class="tt">${esc(r.title)}</div><div class="small muted">${esc(r.detail)}</div><div style="margin-top:4px">${src(r.cites)}</div></div><div style="text-align:right;min-width:120px">${r.turns_bad ? `<div class="small muted">Turns bad</div><b>${D(r.turns_bad)}</b><div class="small muted">${daysTo(r.turns_bad) <= 0 ? "now" : `in ${daysTo(r.turns_bad)} days`}</div>` : '<span class="small muted">Ongoing</span>'}</div></div>`).join("")}</div>`;
}
function tUnknowns(a) {
  return `<p class="muted" style="margin-top:0">What the plan rests on that we don't know yet — and exactly who to ask.</p><div class="grid g2">${a.gaps.map((g) => `<div class="card"><div class="small muted">We don't know</div><b>${esc(g.what)}</b><div class="small" style="margin-top:6px"><b>Why it matters:</b> ${esc(g.why)}</div><div class="row small" style="margin-top:8px"><span class="pill c-violet">Ask</span>${esc(g.who)}</div><div style="margin-top:6px">${src(g.cites)}</div></div>`).join("")}</div>`;
}
function ticketRows(list, showAcct) {
  return `<div class="tw"><table><tr><th>Priority</th><th>Ticket</th>${showAcct ? "<th>Account</th>" : ""}<th>From</th><th>Waiting</th><th>Owner</th><th>Status</th><th></th></tr>${list.map((t) => `<tr><td><span class="pill c-${t.color}">${t.priority}</span></td><td><b>${esc(t.id)}</b><div class="small">${esc(t.subject)}</div></td>${showAcct ? `<td>${esc(shortName(t.a))}</td>` : ""}<td class="small">${esc(t.from)}</td><td>${t.open ? `<b style="color:var(--${t.age > 30 ? "red" : t.age > 7 ? "amber" : "ink"})">${esc(t.waiting)}</b>` : "—"}</td><td>${t.owner ? esc(t.owner) : t.open ? '<span class="pill c-red">Unassigned</span>' : "—"}</td><td class="small">${esc(t.status)}</td><td>${src(t.cites, "Open")}</td></tr>`).join("")}</table></div>`;
}
function tTickets(a) { return `<div class="card">${ticketRows(a.tickets, false)}</div>`; }
function tHistory(a) {
  const ic = { call: ["📞", "c-blue"], email: ["✉️", "c-violet"], ticket: ["🎫", "c-amber"], note: ["📝", "c-grey"], alert: ["⚡", "c-red"], invoice: ["💷", "c-green"] };
  const types = ["all", "call", "email", "ticket", "alert", "note", "invoice"];
  const list = a.activities.filter((x) => histFilter === "all" || x.type === histFilter);
  return `<div class="row" style="margin-bottom:10px">${types.map((t) => `<button class="filter ${histFilter === t ? "on" : ""}" onclick="histFilter='${t}';render()">${t === "all" ? "Everything" : t[0].toUpperCase() + t.slice(1) + "s"}</button>`).join("")}</div>
  <div class="card">${list.map((x) => `<div class="li"><div class="tl-ic ${ic[x.type][1]}">${ic[x.type][0]}</div><div class="body"><div class="row"><b>${esc(x.title)}</b><span class="small muted">${DY(x.date)}</span></div><div class="small muted">${esc(x.who)}</div><div class="small" style="margin-top:3px">${esc(x.summary)}</div>${x.actions?.length ? `<div class="small muted">Actions: ${esc(x.actions.join(" · "))}</div>` : ""}<div style="margin-top:4px">${src(x.cites, "Attachment")}</div></div></div>`).join("") || '<p class="empty">Nothing here.</p>'}</div>`;
}

// ---------- TICKETS ----------
function renderTickets() {
  const list = S.accounts.flatMap((a) => a.tickets.map((t) => ({ ...t, a }))).sort((x, y) => ({ Urgent: 0, High: 1, Normal: 2, Low: 3 }[x.priority] - { Urgent: 0, High: 1, Normal: 2, Low: 3 }[y.priority]));
  const open = list.filter((t) => t.open);
  $("#main").innerHTML = topbar("Tickets", "Every customer request in one queue — support tickets, emails nobody answered, and live alerts.") + `
  <div class="grid" style="grid-template-columns:repeat(4,1fr)">${[["Open", open.length, "c-blue"], ["Urgent", open.filter((t) => t.priority === "Urgent").length, "c-red"], ["No owner", open.filter((t) => !t.owner).length, "c-amber"], ["Oldest wait", Math.max(0, ...open.map((t) => t.age)) + " days", "c-grey"]].map(([l, n, c]) => `<div class="card"><span class="pill ${c}">${l}</span><div class="big" style="margin-top:6px">${n}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:16px"><h3>Open</h3>${ticketRows(open, true)}</div>
  <details class="card" style="margin-top:16px"><summary>Closed tickets (${list.length - open.length})</summary>${ticketRows(list.filter((t) => !t.open), true)}</details>`;
}

// ---------- CHAT ----------
const CHANNELS = () => [["general", "# general"], ...S.accounts.map((a) => [a.id, `# ${shortName(a).toLowerCase().replace(/ /g, "-")}`]), ["ask", "✨ Ask Flightdeck"]];
function renderChat() {
  $("#main").innerHTML = topbar("Team chat", "Talk it through with the team. Mention <b>@flightdeck</b> anywhere, or use ✨ Ask Flightdeck, to get an answer from the account data.") + `
  <div class="card chat" style="padding:0"><div class="chans">${CHANNELS().map(([k, l]) => `<button class="chan ${chatChan === k ? "on" : ""}" onclick="chatChan='${k}';renderChat()">${esc(l)}</button>`).join("")}
    <div class="small muted" style="margin-top:auto;padding:8px">Coach: ${S.assistant === "claude" ? "Claude AI" : "built-in"}</div></div>
    <div class="msgs"><div class="stream" id="stream"></div>
    <div class="suggest">${(chatChan === "ask" || chatChan === "general" ? ["What do we do first?", "What could go wrong this week?", "Who decides the Aldermoor renewal?", "Draft the reply to Karen Mbeki"] : chatChan === "A" ? ["@flightdeck what's blocking Tarn Valley?", "@flightdeck who replaces Rhys?", "@flightdeck open tickets"] : ["@flightdeck how healthy is Aldermoor?", "@flightdeck what don't we know?", "@flightdeck upsell ideas"]).map((q) => `<button class="filter" onclick="sendChat(${JSON.stringify(q).replace(/"/g, "&quot;")})">${esc(q)}</button>`).join("")}</div>
    <div class="compose"><textarea id="chatIn" placeholder="${chatChan === "ask" ? "Ask anything about the accounts…" : "Message the team — add @flightdeck to ask the coach"}" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button class="btn pri" onclick="sendChat()">Send</button></div></div></div>`;
  renderChatStream();
}
function renderChatStream() {
  const el = $("#stream"); if (!el) return;
  const msgs = C.messages.filter((m) => m.channel === chatChan);
  el.innerHTML = msgs.length ? msgs.map((m) => `<div class="msg ${m.ai ? "ai" : ""} ${!m.ai && m.author === me?.name ? "mine" : ""}">${m.ai ? '<img src="/brand.svg" style="width:28px;height:28px;border-radius:8px">' : av(m.author)}<div style="min-width:0"><div class="who"><b>${esc(m.author)}</b> ${m.role ? `· ${esc(m.role)}` : ""} · ${ago(m.at)}</div><div class="bub">${linkCites(m.text)}</div></div></div>`).join("")
    : `<div class="empty" style="text-align:center;margin:auto">No messages yet in this channel. ${chatChan === "ask" ? "Ask a question to get started." : "Say hello 👋"}</div>`;
  el.scrollTop = el.scrollHeight;
}
let sending = false;
async function sendChat(text) {
  const box = $("#chatIn"); text = (text ?? box.value).trim(); if (!text || sending) return;
  if (!me) return askWho();
  sending = true; box.value = "";
  const asking = chatChan === "ask" || /@flightdeck/i.test(text);
  await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ channel: chatChan, author: me.name, role: me.role, text }) });
  await loadCollab();
  if (asking) { const el = $("#stream"); el.insertAdjacentHTML("beforeend", `<div class="msg ai" id="typing"><img src="/brand.svg" style="width:28px;height:28px;border-radius:8px"><div class="bub muted">Flightdeck is thinking…</div></div>`); el.scrollTop = el.scrollHeight; }
  sending = false;
}
function discuss(id) {
  const m = allMoves().find((x) => x.id === id);
  chatChan = m.acc.id; route = "chat"; ls.set("fd_route", "chat"); render();
  $("#chatIn").value = `About “${m.short}” (${m.owner.name}, due ${D(m.due)}): `; $("#chatIn").focus();
}

// ---------- UPDATES ----------
function renderUpdates() {
  const sig = S.accounts.flatMap((a) => a.signals.map((id) => ({ ...S.evidence[id], a })));
  const notes = [...new Map(S.accounts.flatMap((a) => a.notes).map((n) => [JSON.stringify(n), n])).values()];
  $("#main").innerHTML = topbar("Live updates", "Flightdeck checks for new account data every few minutes and updates every page by itself.") + `
  <div class="grid g2"><div class="card"><h3>⚡ Live alerts from the accounts</h3>${sig.map((e) => `<div class="li"><div class="tl-ic c-red">⚡</div><div class="body"><b>${esc(e.label.split(": ").pop())}</b><div class="small muted">${esc(shortName(e.a))} · ${DY(e.date)}</div><div class="small">${esc(e.text)}</div>${src([e.id], "Original message")}</div></div>`).join("")}</div>
  <div class="card"><h3>🔄 What changed recently</h3>${S.changes.slice(0, 25).map((c) => `<div class="li"><div class="body small"><b>${esc(c.summary.replace(/^Note written back to MCP: /, "Logged to Account Quest: "))}</b><div class="muted">${ago(c.at)}</div></div></div>`).join("") || '<p class="empty">No changes since the last restart.</p>'}
    <h3 style="margin-top:18px">📝 Logged back to Account Quest</h3>${notes.slice(-8).reverse().map((n) => `<div class="li"><span class="pill c-grey">${esc(n.kind || "note")}</span><div class="body small"><b>${esc(n.title || "")}</b><div class="muted">${esc((n.text || "").slice(0, 140))}</div></div></div>`).join("") || '<p class="empty">Nothing yet.</p>'}
    ${S.pendingNotes.length ? `<p class="small muted">${S.pendingNotes.length} more waiting to be logged (one per minute).</p>` : ""}</div></div>`;
}

// ---------- HOW IT WORKS ----------
function renderHow() {
  $("#main").innerHTML = topbar("How Flightdeck works", "The rules behind every number — in plain English.") + `<div class="card howto">
  <h3>Where the data comes from</h3><p>Everything comes live from the Account Quest data service: accounts, people, deals, calls, emails, contracts, tickets, flight logs and live alerts. We also use the morning discovery notes. Flightdeck checks for new data every few minutes and updates by itself. Every number has a 📎 button that opens the original record.</p>
  <h3>What a deal is worth</h3><p>We only count value that real usage backs. Price per dock = contract value ÷ number of docks. Docks at sites that actually fly count as <b>backed</b>. Docks nobody flies are <b>at risk</b>. Big claims nobody has proved, like "a 30-dock stadium project" or "€1.2M saved", are listed separately and never added in. The two accounts use different currencies and are never added together.</p>
  <h3>How deals are qualified</h3><p>Each deal gets a MEDDPICC checklist: Metrics, Economic buyer, Decision criteria, Decision process, Paper process, Identified pain, Champion and Competition. Green means proven by a record. Amber means partly known. Red means unknown. The forecast puts a deal in <b>Commit</b> only when usage backs it, it is past Qualify, and at least half the checklist is known.</p>
  <h3>How actions are ranked</h3><p>By money at stake, how urgent it is, and how many days are left. Every action has an owner from the team, a due date inside the customer's deadline, and a playbook: steps, questions to ask, and a ready-to-send draft. New alerts create new actions automatically. A request "this week" is due that Friday, and a contact leaving triggers a hand-over plan.</p>
  <h3>How risk is judged</h3><p>Red = act now; amber = watch. Each risk has the date it turns bad:</p>
  <ul><li>For a deadline, the deadline itself.</li><li>For a renewal, 30 days before the contract ends.</li><li>For a contact, 90 days of silence.</li><li>For an unanswered request, 30 days without a reply.</li></ul>
  <h3>Health score</h3><p>Five parts, each 0–100:</p>
  <ul><li>Product use (30%)</li><li>Relationships (20%)</li><li>Access to decision makers (20%)</li><li>Support (15%)</li><li>Momentum (15%)</li></ul>
  <p>70+ is healthy, 45–69 needs watching, and below 45 is at risk.</p>
  <h3>What it doesn't do yet</h3><p>It can't tell which dock sits at which force or plant, because the install sheets aren't on file. It can't read the content of ticket FB-10412. Its links between records are labelled "likely" where unproven.</p>
  <h3>For developers</h3><p class="small muted">Source code, rules and the MCP endpoint (<span class="mono">POST /mcp</span>) are in the public repository's README.</p></div>`;
}

// ---------- drawer, sources ----------
function openDrawer() { $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); }
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }
document.addEventListener("keydown", (e) => e.key === "Escape" && closeDrawer());
async function openSources(ids) {
  if (ids.length === 1) return openRecord(ids[0]);
  $("#dk").textContent = "Sources"; $("#dt").textContent = `${ids.length} records back this`;
  $("#db").innerHTML = ids.map((id) => { const e = S.evidence[id]; return `<div class="li" style="cursor:pointer" onclick="openRecord('${esc(id)}')"><div class="tl-ic c-blue">📎</div><div class="body"><b>${esc(e.human)}</b><div class="small muted">${esc(e.label)}</div></div></div>`; }).join("");
  openDrawer();
}
async function openRecord(id) {
  let e = S.evidence[id];
  if (e.truncated) e = { ...e, ...(await fetch("/api/evidence?id=" + encodeURIComponent(id)).then((r) => r.json())) };
  $("#dk").textContent = e.human || e.kind; $("#dt").textContent = e.label;
  const rows = [["Said by", e.said_by], ["Status", e.status && { verified: "Verified by a file", told: "Told to us — not yet verified", claim: "Claim — may be wrong" }[e.status]], ["Date", e.date && DY(e.date)], ["Relationship", e.relationship], ["Stage", e.stage]].filter((r) => r[1]);
  $("#db").innerHTML = `${rows.length ? `<div class="kv">${rows.map(([k, v]) => `<div>${k}</div><div>${esc(v)}</div>`).join("")}</div>` : ""}
    ${e.kind === "calc" ? `<div class="how" style="margin:0 0 12px"><b>How we worked it out</b><p style="margin:6px 0 0">${esc(e.text)}</p></div>` : ""}
    ${e.cites?.length ? `<div class="small muted">Built from</div><div style="margin:4px 0 12px">${e.cites.map((c) => S.evidence[c] ? `<button class="src" onclick="openRecord('${esc(c)}')">📎 ${esc(S.evidence[c].human)}</button>` : "").join("")}</div>` : ""}
    ${e.text && e.kind !== "calc" ? `<div class="small muted">Original record</div><pre>${esc(e.text)}</pre>` : ""}
    ${e.records ? e.records.map((r) => `<div class="small muted" style="margin-top:10px">${esc(r.kind)} attached</div><pre>${esc(r.text)}</pre>`).join("") : ""}
    <div class="small muted" style="margin-top:12px">Reference: <span class="mono">${esc(id)}</span></div>`;
  openDrawer();
}

// ---------- actions ----------
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 3500); }
function copyDraft(id) { const m = allMoves().find((x) => x.id === id); const d = m.how.draft; navigator.clipboard?.writeText(`Subject: ${d.subject}\n\n${d.body}`).then(() => toast("Draft copied — paste it into your email"), () => toast("Couldn't copy — select the text instead")); }
async function logToMcp(id) {
  const m = allMoves().find((x) => x.id === id);
  let key = ls.get("fd_wk") || "";
  const body = (k) => JSON.stringify({ account: m.acc.id, kind: "next_step", title: m.short.slice(0, 150), text: `${m.why}\nOwner: ${m.owner.name}. Due: ${m.due}.\nSources: ${m.cites.join(", ")}`, key: k });
  let r = await fetch("/api/notes", { method: "POST", headers: { "content-type": "application/json" }, body: body(key) });
  if (r.status === 403) { key = prompt("Team write key (ask your manager):") || ""; ls.set("fd_wk", key); r = await fetch("/api/notes", { method: "POST", headers: { "content-type": "application/json" }, body: body(key) }); }
  toast(r.ok ? "Logged — it reaches Account Quest within a minute" : "Not logged: wrong team key");
}
function askWho() {
  $("#whoRole").innerHTML = S.roles.map((r) => `<option ${me?.role === r ? "selected" : ""}>${esc(r)}</option>`).join("");
  $("#whoName").value = me?.name || ""; $("#who").classList.add("open"); $("#scrim").classList.add("open"); $("#whoName").focus();
}
function saveWho() { const n = $("#whoName").value.trim(); if (!n) return; me = { name: n.slice(0, 30), role: $("#whoRole").value }; ls.set("fd_me", JSON.stringify(me)); $("#who").classList.remove("open"); $("#scrim").classList.remove("open"); render(); toast(`Welcome, ${me.name}`); }

$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const n = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; ls.set("fd_theme", n); };
if (ls.get("fd_theme")) document.documentElement.dataset.theme = ls.get("fd_theme");

// live: server pushes data updates and chat
try {
  const es = new EventSource("/api/events");
  es.addEventListener("update", (m) => { const c = JSON.parse(m.data).changes?.[0]; if (c && Date.now() - new Date(c.at) < 70000 && /signal|new_|changed_/.test(c.kind)) toast("New: " + c.summary); load(); });
  es.addEventListener("collab", (m) => { const ev = JSON.parse(m.data); if (ev.type === "chat" && ev.message.ai && route !== "chat") toast("Flightdeck answered in chat"); loadCollab(); });
} catch {}
setInterval(() => S && renderNav(), 30000);
setInterval(load, 120000);
load().then(() => { if (!me) askWho(); });
</script>
</body>
</html>
